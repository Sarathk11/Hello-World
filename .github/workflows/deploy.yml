name: Deploy UiPath Package to Orchestrator

on:
  push:
    branches:
      - main # Triggers the pipeline when code is pushed to the main branch

jobs:
  build-and-deploy:
    runs-on: windows-latest # Required to build UiPath projects natively

    steps:
    # Step 4.1: Check out the code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 4.2: Set up Node.js environment (required for UiPath CLI)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # Step 4.3: Install the UiPath CLI tool globally
    - name: Install UiPath CLI
      run: npm install -g @uipath/cli

    # Step 4.4: Pack the UiPath project into a NuGet package (.nupkg)
    - name: Pack UiPath Project
      run: |
        uip pack . --output . --version 1.0.${{ github.run_number }}

    # Step 4.5: Log into UiPath Orchestrator and deploy the package
    - name: Deploy to Orchestrator
      env:
        UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
        UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
      run: |
        uip login --client-id env.UIPATH_CLIENT_ID --client-secret env.UIPATH_CLIENT_SECRET --account ${{ secrets.UIPATH_ACCOUNT_NAME }} --tenant ${{ secrets.UIPATH_TENANT_NAME }}
        uip deploy --package (Get-Item *.nupkg).FullName
